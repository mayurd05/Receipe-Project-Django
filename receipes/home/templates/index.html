<html>
    <head>
        <title>Receipes</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    </head>
    <body>
        {% block start  %}
        <div class="container">
        <form class="col-6 mx-auto card p-3 shadow-lg" method= "post" enctype="multipart/form-data">
          {% csrf_token %}
            {{form}}
            <h2>Add Receipes</h2>
            <div class="mb-3">
              <label for="example1" class="form-label fw-medium fs-5">Receipe Name</label>
              <input type="text" name="receipe_name" class="form-control"   >
              
            </div>
            <div class="mb-3">
              <label for="Password1" class="form-label fw-medium fs-5">Receipe Desc</label>
              <textarea type="text" name="receipe_desc" class="form-control"></textarea>
            </div>
            <div class="mb-3">
              <label for="exampleInputImage1" class="form-label fw-medium fs-5">Receipe Image</label>
              <input  type="file" name="receipe_img" class="form-control" />
            </div>
              
            <button type="submit" class="btn btn-success">Add Receipes</button>
          </form>
        </div>
        {%endblock%}
    </body>
</html>
